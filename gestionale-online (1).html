function comprimiImmagine(file, cb) {
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 320, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', 0.75));
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

const STORAGE_PREFIX = 'sp-impianti:';
function loadKey(key, fallback) {
  try {
    const raw = localStorage.getItem(STORAGE_PREFIX + key);
    return raw ? JSON.parse(raw) : fallback;
  } catch {
    return fallback;
  }
}
function saveKey(key, value) {
  try {
    localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));
    return true;
  } catch {
    return false;
  }
}

const TIPI = ['clienti', 'movimenti', 'preventivi', 'prodotti', 'dichiarazioni'];
const PREPEND = { movimenti: true, preventivi: true, dichiarazioni: true }; // nell'app i nuovi elementi vanno in cima
let snapRemoto = {}; // ultima versione nota sul database: tipo -> { id: json }

async function scaricaTutto(userId) {
  const righe = [];
  for (let da = 0; ; da += 1000) {
    const { data, error } = await sb.from('dati').select('tipo,id,valore,ord')
      .eq('user_id', userId).order('ord', { ascending: true }).order('id', { ascending: true }).range(da, da + 999);
    if (error) throw error;
    righe.push(...data);
    if (data.length < 1000) break;
  }
  const dati = { azienda: AZIENDA_VUOTA };
  TIPI.forEach(t => { dati[t] = []; });
  const meta = {}, snap = {};
  righe.forEach(r => {
    if (r.tipo === 'azienda') dati.azienda = { ...AZIENDA_VUOTA, ...r.valore };
    else if (r.tipo === 'meta') meta[r.id] = r.valore;
    else if (dati[r.tipo]) dati[r.tipo].push(r.valore);
    if (!snap[r.tipo]) snap[r.tipo] = {};
    snap[r.tipo][r.id] = JSON.stringify(r.valore);
  });
  Object.keys(PREPEND).forEach(t => dati[t].reverse());
  return { dati, meta, snap, vuoto: righe.length === 0 };
}

function calcolaDiff(dati) {
  const nuovi = [], modificati = [], eliminati = [], snap = {};
  TIPI.forEach(t => {
    const arr = dati[t], vecchio = snapRemoto[t] || {}, corrente = {};
    arr.forEach((x, i) => {
      const id = String(x.id), js = JSON.stringify(x);
      corrente[id] = js;
      if (vecchio[id] === js) return;
      if (vecchio[id] === undefined) nuovi.push({ tipo: t, id, valore: x, c: PREPEND[t] ? arr.length - 1 - i : i });
      else modificati.push({ tipo: t, id, valore: x });
    });
    Object.keys(vecchio).forEach(id => { if (corrente[id] === undefined) eliminati.push({ tipo: t, id }); });
    snap[t] = corrente;
  });
  const az = JSON.stringify(dati.azienda);
  if ((snapRemoto.azienda || {}).azienda !== az) modificati.push({ tipo: 'azienda', id: 'azienda', valore: dati.azienda });
  snap.azienda = { azienda: az };
  if (snapRemoto.meta) snap.meta = snapRemoto.meta;
  return { nuovi, modificati, eliminati, snap, vuoto: !nuovi.length && !modificati.length && !eliminati.length };
}

async function inviaDiff(userId, diff) {
  const base = Date.now() * 1000;
  const pezzi = (a, n) => { const o = []; for (let i = 0; i < a.length; i += n) o.push(a.slice(i, i + n)); return o; };
  for (const p of pezzi(diff.nuovi, 100)) {
    const { error } = await sb.from('dati').upsert(p.map(r => ({ user_id: userId, tipo: r.tipo, id: r.id, valore: r.valore, ord: base + r.c })), { onConflict: 'user_id,tipo,id' });
    if (error) throw error;
  }
  for (const p of pezzi(diff.modificati, 100)) {
    const { error } = await sb.from('dati').upsert(p.map(r => ({ user_id: userId, tipo: r.tipo, id: r.id, valore: r.valore })), { onConflict: 'user_id,tipo,id' });
    if (error) throw error;
  }
  for (const t of TIPI) {
    const ids = diff.eliminati.filter(r => r.tipo === t).map(r => r.id);
    for (const p of pezzi(ids, 100)) {
      const { error } = await sb.from('dati').delete().eq('user_id', userId).eq('tipo', t).in('id', p);
      if (error) throw error;
    }
  }
  snapRemoto = diff.snap;
}

function Login() {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');

  const [info, setInfo] = useState('');
  const [invio, setInvio] = useState(false);
  const [registra, setRegistra] = useState(false);
  const entra = async (e) => {
    e.preventDefault();
    if (!sb) return;
    setInvio(true); setErrore(''); setInfo('');
    const em = email.trim(), pw = password.trim();
    if (registra) {
      if (pw.length < 6) { setErrore('La password deve avere almeno 6 caratteri.'); setInvio(false); return; }
      const { data, error } = await sb.auth.signUp({ email: em, password: pw });
      if (error) setErrore('Registrazione non riuscita: ' + error.message);
      else if (!data.session) { setInfo('Account creato. Controlla la tua email e clicca il link di conferma, poi torna qui e accedi.'); setRegistra(false); }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email: em, password: pw });
      if (error) setErrore(/invalid|credentials/i.test(error.message) ? 'Email o password non corretti.' : /confirm/i.test(error.message) ? 'Email non ancora confermata: apri il link ricevuto per email.' : 'Accesso non riuscito: ' + error.message);
    }
    setInvio(false);
  };
  return (
    <div className="min-h-screen flex items-center justify-center bg-slate-900 p-4">
      <form onSubmit={entra} className="w-full max-w-sm bg-white rounded-2xl shadow-xl p-6 space-y-4">
        <div className="flex items-center gap-2 text-blue-600">
          <ShieldCheck className="w-9 h-9" />
          <span className="text-2xl font-bold text-slate-900">SP Impianti</span>
        </div>
        <p className="text-sm text-slate-500">{registra ? 'Crea il tuo account per usare il gestionale.' : 'Accedi per aprire il gestionale.'}</p>
        {!sb && <div className="text-xs bg-amber-50 text-amber-700 border border-amber-200 rounded-lg p-3">Database non configurato: inserisci SUPABASE_URL e SUPABASE_ANON_KEY all'inizio del codice.</div>}
        <input type="email" autoComplete="username" required value={email} onChange={e => setEmail(e.target.value)} placeholder="Email" className="w-full border border-slate-300 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500" />
        <input type="password" autoComplete={registra ? 'new-password' : 'current-password'} required value={password} onChange={e => setPassword(e.target.value)} placeholder="Password" className="w-full border border-slate-300 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500" />
        {errore && <div className="text-sm text-red-600">{errore}</div>}
        {info && <div className="text-sm text-emerald-700">{info}</div>}
        <button type="submit" disabled={invio || !sb} className="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-semibold rounded-xl py-3">{invio ? 'Attendi...' : (registra ? 'Crea account' : 'Accedi')}</button>
        <button type="button" onClick={() => { setRegistra(!registra); setErrore(''); setInfo(''); }} className="w-full text-sm text-blue-600 hover:text-blue-800">{registra ? 'Ho già un account: accedi' : 'Non ho un account: creane uno'}</button>
      </form>
    </div>
  );
}

function Root() {
  const [sess, setSess] = useState(sb ? undefined : null);
  useEffect(() => {
    if (!sb) return;
    sb.auth.getSession().then(({ data }) => setSess(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_ev, s) => setSess(s));
    return () => sub.subscription.unsubscribe();
  }, []);
  if (sess === undefined) return <div className="flex h-screen items-center justify-center bg-slate-100 text-slate-500">Caricamento...</div>;
  if (!sess) return <Login />;
  return <App key={sess.user.id} user={sess.user} onLogout={() => sb.auth.signOut()} />;
}

  const handleGeneraDico = (e) => {
    e.preventDefault();
    const c = clienti.find(x => x.id === formDico.clienteId);
    const anno = new Date().getFullYear();
    const ultimo = Math.max(0, ...dichiarazioni.filter(d => d.numero.startsWith(anno + '/')).map(d => parseInt(d.numero.split('/')[1]) || 0));
    const nuova = { ...formDico, id: Date.now().toString(), numero: `${anno}/${String(ultimo + 1).padStart(3, '0')}`, cliente: c ? c.nome : '', indirizzo: c ? c.indirizzo : '' };
    setDichiarazioni([nuova, ...dichiarazioni]);
    setDicoInPreview(nuova);
    setFormDico(DICO_VUOTA());
    mostraToast('Dichiarazione salvata.');
  };
  const richiediEliminaDico = (d) => {
    setConferma({
      messaggio: `Eliminare la DiCo n. ${d.numero}? L'operazione non è reversibile.`,
      onConferma: () => {
        setDichiarazioni(dichiarazioni.filter(x => x.id !== d.id));
        setDicoInPreview(null);
        mostraToast('Dichiarazione eliminata.', 'info');
        setConferma(null);
      }
    });
  };
  const richiediEliminaPreventivo = (pv) => {
    setConferma({
      messaggio: `Eliminare il preventivo #${pv.id.substring(pv.id.length - 6)} di ${pv.cliente}?`,
      onConferma: () => {
        setPreventivi(preventivi.filter(x => x.id !== pv.id));
        setPreventivoInPreview(null);
        mostraToast('Preventivo eliminato.', 'info');
        setConferma(null);
      }
    });
  };
  const esportaBackup = () => {
    const dati = { versione: 1, clienti, movimenti, preventivi, prodotti, dichiarazioni, azienda };
    const blob = new Blob([JSON.stringify(dati, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `sp-impianti-backup-${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    mostraToast('Backup scaricato.');
  };
  const importaBackup = (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const d = JSON.parse(reader.result);
        if (!Array.isArray(d.clienti) || !Array.isArray(d.prodotti)) throw new Error('formato');
        setConferma({
          messaggio: 'Importare il backup? Tutti i dati attuali verranno sostituiti.',
          onConferma: () => {
            setClienti(d.clienti); setProdotti(d.prodotti);
            setMovimenti(d.movimenti || []); setPreventivi(d.preventivi || []);
            setDichiarazioni(d.dichiarazioni || []); setAzienda({ ...AZIENDA_VUOTA, ...(d.azienda || {}) });
            setConferma(null);
            mostraToast('Backup importato.');
          }
        });
      } catch { mostraToast('File di backup non valido.', 'info'); }
    };
    reader.readAsText(file);
  };

  const cambiaTab = (tabId) => {
    setActiveTab(tabId);
    setIsSidebarOpen(false);
    if (tabId === 'preventivi') setViewPreventivi('dashboard');
    setClienteSelezionatoPerDettaglio(null);
  };

  const aggiungiArticolo = (articolo) => setPrevArticoli([...prevArticoli, { ...articolo, quantita: 1 }]);
  const rimuoviArticolo = (index) => setPrevArticoli(prevArticoli.filter((_, i) => i !== index));
  const cambiaQuantita = (index, delta) => {
    const nuoviArticoli = [...prevArticoli];
    nuoviArticoli[index].quantita = Math.max(1, nuoviArticoli[index].quantita + delta);
    setPrevArticoli(nuoviArticoli);
  };
  const totalePreventivo = prevArticoli.reduce((acc, curr) => acc + (curr.prezzo * curr.quantita), 0);
  const scontoNum = Math.min(100, Math.max(0, parseFloat(prevSconto) || 0));
  const ivaNum = Math.max(0, parseFloat(prevIva) || 0);
  const imponibilePrev = totalePreventivo * (1 - scontoNum / 100);
  const ivaImportoPrev = imponibilePrev * ivaNum / 100;
  const totaleFinalePrev = imponibilePrev + ivaImportoPrev;

  const handleSalvaPreventivo = () => {
    const clienteObj = clienti.find(c => c.id === prevCliente);
    const nuovoPreventivo = {
      id: Date.now().toString(),
      data: new Date().toISOString().split('T')[0],
      cliente: clienteObj ? clienteObj.nome : 'Cliente Sconosciuto',
      clienteId: prevCliente,
      articoli: [...prevArticoli],
      subtotale: totalePreventivo, sconto: scontoNum, imponibile: imponibilePrev, iva: ivaNum, ivaImporto: ivaImportoPrev,
      totale: totaleFinalePrev,
      stato: 'In attesa'
    };
    setPreventivi([nuovoPreventivo, ...preventivi]);
    setPreventivoInPreview(nuovoPreventivo);
    setPrevCliente('');
    setPrevArticoli([]);
    setPrevSconto(0); setPrevIva(22);
    setViewPreventivi('dashboard');
    mostraToast('Preventivo creato con successo.');
  };

  const handleAggiornaStatoPreventivo = (id, nuovoStato) => {
    const pv = preventivi.find(x => x.id === id);
    aggiornaStato(id, nuovoStato);
    if (nuovoStato === 'Approvato' && pv && pv.stato !== 'Approvato' && !movimenti.some(m => m.prevId === id)) {
      setConferma({
        messaggio: `Preventivo approvato. Registrare l'entrata di ${pv.totale.toFixed(2)} € in Prima Nota?`,
        onConferma: () => {
          setMovimenti(ms => [{ id: Date.now().toString(), data: new Date().toISOString().split('T')[0], tipo: 'entrata', importo: pv.totale, descrizione: `Preventivo #${id.substring(id.length - 6)} approvato`, cliente: pv.cliente, prevId: id }, ...ms]);
          setConferma(null);
          mostraToast('Entrata registrata in Prima Nota.');
        }
      });
    }
  };
  const aggiornaStato = (id, nuovoStato) => {
    setPreventivi(preventivi.map(p => p.id === id ? { ...p, stato: nuovoStato } : p));
    if (preventivoInPreview && preventivoInPreview.id === id) {
      setPreventivoInPreview({ ...preventivoInPreview, stato: nuovoStato });
    }
    mostraToast(`Preventivo segnato come "${nuovoStato}".`);
  };

  const handleInviaEmail = () => {
    const pv = preventivoInPreview;
    const c = clienti.find(x => x.id === pv.clienteId);
    const righe = pv.articoli.map(a => `- ${a.nome} x${a.quantita}: ${(a.prezzo * a.quantita).toFixed(2)} €`).join('\n');
    const corpo = `Gentile ${pv.cliente},\n\ndi seguito il dettaglio del preventivo del ${pv.data}:\n\n${righe}\n\nTotale: ${pv.totale.toFixed(2)} €\n\nCordiali saluti\n${azienda.ragioneSociale || ''}`;
    window.location.href = `mailto:${c && c.email ? c.email : ''}?subject=${encodeURIComponent('Preventivo del ' + pv.data)}&body=${encodeURIComponent(corpo)}`;
  };

  const vediDettaglioCliente = (cliente) => setClienteSelezionatoPerDettaglio(cliente);
  const inAttesa = preventivi.filter(x => x.stato === 'In attesa');
  const valoreAttesa = inAttesa.reduce((a, x) => a + x.totale, 0);

  if (loading && erroreCaricamento) {
    return (
      <div className="flex h-screen items-center justify-center bg-slate-100 text-slate-600 flex-col gap-4 p-6 text-center">
        <AlertTriangle className="w-12 h-12 text-amber-500" />
        <span>{erroreCaricamento}</span>
        <div className="flex gap-3">
          <button onClick={() => setTentativo(t => t + 1)} className="px-5 py-2 rounded-xl bg-blue-600 text-white font-semibold">Riprova</button>
          <button onClick={onLogout} className="px-5 py-2 rounded-xl bg-slate-200 text-slate-700 font-semibold">Esci</button>
        </div>
      </div>
    );
  }
  if (loading) {
    return (
      <div className="flex h-screen items-center justify-center bg-slate-100 text-slate-500 flex-col gap-4">
        <ShieldCheck className="w-12 h-12 text-blue-500 animate-pulse" />
        <span>Caricamento dati...</span>
      </div>
    );
  }

  return (
    <div className="flex flex-col md:flex-row h-screen overflow-hidden bg-slate-50 font-sans text-slate-800">
      
      {/* Topbar mobile */}
      <div className="md:hidden bg-slate-900 text-white p-4 flex justify-between items-center z-20 shrink-0 shadow-md">
        <div className="flex items-center gap-2 text-blue-400">
          <ShieldCheck className="w-7 h-7" />
          <span className="text-xl font-bold text-white tracking-wide">SP Impianti</span>
        </div>
        <button onClick={() => setIsSidebarOpen(true)} className="p-1 text-slate-300 hover:text-white">
          <Menu className="w-7 h-7" />
        </button>
      </div>

      {isSidebarOpen && (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-30 md:hidden" onClick={() => setIsSidebarOpen(false)}></div>
      )}

      {/* Sidebar */}
      <aside className={`fixed md:static inset-y-0 left-0 z-40 w-64 bg-slate-900 text-white flex flex-col justify-between p-4 shadow-xl transition-transform duration-300 ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}`}>
        <div>
          <div className="flex items-center justify-between mb-8 mt-2 px-2">
            <div className="flex items-center gap-2 text-blue-400">
              <ShieldCheck className="w-8 h-8" />
              <span className="text-xl font-bold text-white tracking-wide">SP Impianti</span>
            </div>
            <button onClick={() => setIsSidebarOpen(false)} className="md:hidden text-slate-400 hover:text-white">
              <X className="w-6 h-6" />
            </button>
          </div>
          <nav className="space-y-2">
            {[
              { id: 'dashboard', icon: ShieldCheck, label: 'Panoramica' },
              { id: 'clienti', icon: Users, label: 'Clienti & Impianti' },
              { id: 'prodotti', icon: Package, label: 'Listino Prodotti' },
              { id: 'preventivi', icon: FileText, label: 'Preventivi' },
              { id: 'certificazioni', icon: Award, label: 'Certificazioni DiCo' },
              { id: 'contabilita', icon: Wallet, label: 'Prima Nota' }
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => cambiaTab(tab.id)}
                className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200 ${
                  activeTab === tab.id
                    ? 'bg-blue-600 shadow-md shadow-blue-900/50 text-white'
                    : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                }`}
              >
                <tab.icon className="w-5 h-5" /> {tab.label}
              </button>
            ))}
          </nav>
          <div className="mt-6 pt-4 border-t border-slate-800 space-y-1">
            <button onClick={() => { setIsAziendaOpen(true); setIsSidebarOpen(false); }} className="w-full flex items-center gap-3 px-4 py-2 rounded-xl text-xs font-medium text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition"><Pencil className="w-4 h-4" /> Dati azienda</button>
            <button onClick={esportaBackup} className="w-full flex items-center gap-3 px-4 py-2 rounded-xl text-xs font-medium text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition"><Download className="w-4 h-4" /> Esporta backup</button>
            <button onClick={() => fileImport.current && fileImport.current.click()} className="w-full flex items-center gap-3 px-4 py-2 rounded-xl text-xs font-medium text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition"><Upload className="w-4 h-4" /> Importa backup</button>
            <input ref={fileImport} type="file" accept="application/json,.json" onChange={importaBackup} className="hidden" />
            <button onClick={onLogout} className="w-full flex items-center gap-3 px-4 py-2 rounded-xl text-xs font-medium text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition"><LogOut className="w-4 h-4" /> Esci ({user.email})</button>
          </div>
        </div>
        <div className="text-xs text-slate-500 border-t border-slate-800 pt-4 px-2 flex items-center justify-center gap-2">
          {saveState === 'saving' && <><Loader2 className="w-3 h-3 animate-spin" /> Salvataggio...</>}
          {saveState === 'saved' && <><Check className="w-3 h-3 text-emerald-400" /> Dati salvati</>}
          {saveState === 'error' && <><AlertTriangle className="w-3 h-3 text-red-400" /> Errore salvataggio</>}
          {saveState === 'idle' && <>Dati salvati online</>}
        </div>
      </aside>

      {/* Main Content */}
      <main className="flex-1 overflow-y-auto p-4 md:p-8 bg-slate-50">

        {/* ================= TAB: PANORAMICA ================= */}
        {activeTab === 'dashboard' && (
          <div className="animate-in">
            <h1 className="text-2xl md:text-3xl font-bold text-slate-900 tracking-tight mb-1">{azienda.ragioneSociale || 'SP Impianti'}</h1>
            <p className="text-slate-500 mb-6 text-sm md:text-base">Panoramica dell'attività.</p>
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
              {[['Clienti', clienti.length, 'text-slate-900'], ['Preventivi in attesa', `${inAttesa.length} · ${valoreAttesa.toFixed(2)} €`, 'text-amber-600'], ['Saldo Prima Nota', `${statistiche.saldo.toFixed(2)} €`, statistiche.saldo >= 0 ? 'text-emerald-600' : 'text-red-600'], ['DiCo emesse', dichiarazioni.length, 'text-slate-900']].map(([l, v, c]) => (
                <div key={l} className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                  <div className="text-xs font-bold uppercase text-slate-400">{l}</div>
                  <div className={`text-xl font-bold mt-1 ${c}`}>{v}</div>
                </div>
              ))}
            </div>
            <div className="flex flex-wrap gap-3 mb-6">
              <button onClick={() => { cambiaTab('preventivi'); setViewPreventivi('nuovo'); }} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl text-sm font-semibold shadow-md">Nuovo preventivo</button>
              <button onClick={() => { cambiaTab('clienti'); apriNuovoCliente(); }} className="bg-white hover:bg-slate-100 border border-slate-200 text-slate-700 px-4 py-2.5 rounded-xl text-sm font-semibold">Nuovo cliente</button>
              <button onClick={() => cambiaTab('certificazioni')} className="bg-white hover:bg-slate-100 border border-slate-200 text-slate-700 px-4 py-2.5 rounded-xl text-sm font-semibold">Nuova DiCo</button>
            </div>
            <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5">
              <h2 className="font-bold text-slate-800 mb-3">Preventivi in attesa di risposta</h2>
              {inAttesa.length === 0 ? <div className="text-slate-400 text-sm py-4 text-center">Nessun preventivo in attesa.</div> : (
                <div className="divide-y divide-slate-100">
                  {inAttesa.slice(0, 8).map(x => (
                    <div key={x.id} onClick={() => setPreventivoInPreview(x)} className="flex justify-between py-3 cursor-pointer hover:bg-slate-50 px-2 rounded-lg text-sm">
                      <span className="font-medium text-slate-800">{x.cliente} <span className="text-xs text-slate-400 ml-2">{x.data}</span></span>
                      <span className="font-bold text-slate-900">{x.totale.toFixed(2)} €</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        )}

        {/* ================= TAB: CLIENTI ================= */}
        {activeTab === 'clienti' && !clienteSelezionatoPerDettaglio && (
          <div className="animate-in">
            <div className="flex flex-col md:flex-row md:justify-between md:items-center gap-4 mb-6">
              <div>
                <h1 className="text-2xl md:text-3xl font-bold text-slate-900 tracking-tight">Anagrafica Clienti</h1>
                <p className="text-slate-500 mt-1 text-sm md:text-base">Gestisci dispositivi, credenziali e interventi per ogni cliente.</p>
              </div>
              <button onClick={apriNuovoCliente} className="bg-blue-600 hover:bg-blue-700 text-white px-4 md:px-5 py-2 md:py-2.5 rounded-xl flex items-center justify-center gap-2 text-sm font-semibold transition shadow-lg shadow-blue-200">
                <UserPlus className="w-4 h-4" /> <span>Nuovo Cliente</span>
              </button>
            </div>

            {clienti.length > 0 && (
              <div className="relative max-w-md mb-4">
                <Search className="w-4 h-4 absolute left-3 top-3 text-slate-400" />
                <input
                  type="text"
                  placeholder="Cerca per nome, email, telefono, indirizzo..."
                  value={ricercaClienti}
                  onChange={(e) => setRicercaClienti(e.target.value)}
                  className="w-full pl-9 pr-4 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none transition shadow-sm"
                />
              </div>
            )}

            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-x-auto">
              {clienti.length === 0 ? (
                <div className="p-12 text-center text-slate-400">
                  <Users className="w-8 h-8 mx-auto mb-3 opacity-30" />
                  Nessun cliente presente. Aggiungine uno per iniziare.
                </div>
              ) : clientiFiltrati.length === 0 ? (
                <div className="p-12 text-center text-slate-400">Nessun cliente corrisponde alla ricerca.</div>
              ) : (
                <table className="w-full text-left border-collapse min-w-[750px]">
                  <thead className="bg-slate-50/80 text-slate-500 text-xs uppercase font-bold border-b border-slate-200">
                    <tr>
                      <th className="p-4">Nome Cliente</th>
                      <th className="p-4">Contatti</th>
                      <th className="p-4">Indirizzo</th>
                      <th className="p-4">Tipo Impianto</th>
                      <th className="p-4 text-right">Azioni</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {clientiFiltrati.map(c => (
                      <tr key={c.id} className="hover:bg-slate-50 transition group cursor-pointer" onClick={() => vediDettaglioCliente(c)}>
                        <td className="p-4 font-medium text-slate-900 flex items-center gap-3">
                          <div className="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-xs shrink-0">
                            {c.nome.charAt(0)}
                          </div>
                          {c.nome}
                        </td>
                        <td className="p-4 text-sm text-slate-600">
                          <div>{c.telefono}</div>
                          <div className="text-xs text-slate-400">{c.email}</div>
                        </td>
                        <td className="p-4 text-sm text-slate-600">{c.indirizzo}</td>
                        <td className="p-4">
                          <span className="bg-slate-100 text-slate-700 px-3 py-1 rounded-full text-xs font-semibold border border-slate-200">
                            {c.tipoImpianto}
                          </span>
                        </td>
                        <td className="p-4 text-right whitespace-nowrap">
                          <button onClick={(e) => { e.stopPropagation(); apriModificaCliente(c); }} className="text-blue-500 hover:text-blue-700 text-sm font-medium mr-3 inline-flex items-center gap-1">
                            <Pencil className="w-3.5 h-3.5" /> Modifica
                          </button>
                          <button onClick={(e) => { e.stopPropagation(); richiediEliminaCliente(c); }} className="text-red-400 hover:text-red-600"><Trash2 className="w-4 h-4 inline"/></button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>
          </div>
        )}

        {/* ================= TAB: DETTAGLIO CLIENTE ================= */}
        {activeTab === 'clienti' && clienteSelezionatoPerDettaglio && (
          <div className="animate-in">
            <div className="mb-6 flex items-center gap-4">
               <button onClick={() => setClienteSelezionatoPerDettaglio(null)} className="p-2 text-slate-500 hover:text-slate-800 bg-white rounded-lg border shadow-sm">
                  <X className="w-5 h-5" />
                </button>
                <div className="flex-1">
                  <h1 className="text-2xl md:text-3xl font-bold text-slate-900 tracking-tight">{clienteSelezionatoPerDettaglio.nome}</h1>
                  <p className="text-slate-500 text-sm md:text-base">Dettaglio cliente e storico attività</p>
                </div>
                <button onClick={() => apriModificaCliente(clienteSelezionatoPerDettaglio)} className="p-2 text-blue-600 hover:bg-blue-50 bg-white rounded-lg border shadow-sm">
                  <Pencil className="w-5 h-5" />
                </button>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              <div className="md:col-span-1 bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
                 <h2 className="font-bold text-slate-800 mb-4 border-b pb-2">Informazioni</h2>
                 <div className="space-y-3 text-sm">
                    <div>
                      <span className="block text-xs text-slate-400 font-semibold uppercase">Telefono</span>
                      <span className="font-medium text-slate-700">{clienteSelezionatoPerDettaglio.telefono}</span>
                    </div>
                    <div>
                      <span className="block text-xs text-slate-400 font-semibold uppercase">Email</span>
                      <span className="font-medium text-slate-700">{clienteSelezionatoPerDettaglio.email || '—'}</span>
                    </div>
                    <div>
                      <span className="block text-xs text-slate-400 font-semibold uppercase">Indirizzo</span>
                      <span className="font-medium text-slate-700">{clienteSelezionatoPerDettaglio.indirizzo || '—'}</span>
                    </div>
                    <div>
                      <span className="block text-xs text-slate-400 font-semibold uppercase">Tipo Impianto</span>
                      <span className="inline-block mt-1 bg-blue-100 text-blue-700 px-2 py-1 rounded text-xs font-bold">{clienteSelezionatoPerDettaglio.tipoImpianto}</span>
                    </div>
                 </div>
                 <button onClick={() => richiediEliminaCliente(clienteSelezionatoPerDettaglio)} className="mt-6 w-full text-red-500 hover:bg-red-50 border border-red-200 rounded-xl py-2 text-sm font-semibold flex items-center justify-center gap-2 transition">
                   <Trash2 className="w-4 h-4" /> Elimina cliente
                 </button>
              </div>

              <div className="md:col-span-2 bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
                 <div className="flex justify-between items-center mb-4 border-b pb-2">
                   <h2 className="font-bold text-slate-800">Storico Preventivi</h2>
                   <button onClick={() => { cambiaTab('preventivi'); setViewPreventivi('nuovo'); setPrevCliente(clienteSelezionatoPerDettaglio.id); }} className="text-blue-600 hover:text-blue-800 text-sm font-semibold flex items-center gap-1">
                     <Plus className="w-4 h-4"/> Nuovo per questo cliente
                   </button>
                 </div>

                 {preventiviDelCliente.length === 0 ? (
                   <div className="text-center text-slate-400 py-8">Nessun preventivo per questo cliente.</div>
                 ) : (
                   <div className="space-y-3">
                     {preventiviDelCliente.map(prev => (
                       <div key={prev.id} className="flex flex-wrap items-center justify-between gap-3 p-3 border border-slate-100 rounded-xl hover:bg-slate-50 transition">
                         <div>
                           <div className="font-semibold text-slate-800">{prev.data}</div>

                <div>
                  <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Email</label>
                  <input type="email" value={formCliente.email} onChange={(e) => setFormCliente({...formCliente, email: e.target.value})} className="w-full p-3 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="email@dominio.it" />
                </div>
              </div>
              <div>
                <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Indirizzo Impianto</label>
                <input type="text" value={formCliente.indirizzo} onChange={(e) => setFormCliente({...formCliente, indirizzo: e.target.value})} className="w-full p-3 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="Via Roma 1, Città" />
              </div>
              <div>
                <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Tipo Impianto</label>
                <select value={formCliente.tipoImpianto} onChange={(e) => setFormCliente({...formCliente, tipoImpianto: e.target.value})} className="w-full p-3 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                  <option value="Allarme">Allarme / Antintrusione</option>
                  <option value="Videosorveglianza">Videosorveglianza</option>
                  <option value="Elettrico">Impianto Elettrico</option>
                  <option value="Altro">Altro</option>
                </select>
              </div>
              <div className="flex gap-3 pt-4">
                <button type="button" onClick={() => setIsClienteModalOpen(false)} className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3 rounded-xl transition">Annulla</button>
                <button type="submit" className="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition shadow-md">Salva</button>
              </div>
            </form>
          </div>
        </div>
      )}

      {/* ================= MODALE: PRODOTTO ================= */}
      {isProdottoModalOpen && (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-lg w-full p-6 md:p-8 shadow-2xl animate-in">
            <div className="flex justify-between items-center mb-6">
              <h2 className="text-xl font-bold text-slate-900">{prodottoInModifica ? 'Modifica Articolo' : 'Nuovo Articolo'}</h2>
              <button onClick={() => setIsProdottoModalOpen(false)} className="text-slate-400 hover:text-slate-600"><X className="w-5 h-5"/></button>
            </div>
            <form onSubmit={handleSalvaProdotto} className="space-y-4">
              <div className="flex items-center gap-4">
                <Thumb src={formProdotto.foto} size="w-20 h-20" />
                <div className="space-y-2">
                  <label className="inline-block cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold px-4 py-2 rounded-xl transition">
                    {formProdotto.foto ? 'Cambia foto' : 'Aggiungi foto'}
                    <input type="file" accept="image/*" className="hidden" onChange={(e) => { const f = e.target.files[0]; e.target.value = ''; if (f) comprimiImmagine(f, (d) => setFormProdotto(fp => ({ ...fp, foto: d }))); }} />
                  </label>
                  {formProdotto.foto && <button type="button" onClick={() => setFormProdotto({ ...formProdotto, foto: '' })} className="block text-xs text-red-500 hover:text-red-700">Rimuovi foto</button>}
                </div>
              </div>
              <div>
                <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Nome Articolo / Servizio *</label>
                <input required type="text" value={formProdotto.nome} onChange={(e) => setFormProdotto({...formProdotto, nome: e.target.value})} className="w-full p-3 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="Es. Telecamera IP 4MP" />
              </div>
              <div>
                <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Codice</label>
                <input type="text" value={formProdotto.codice || ''} onChange={(e) => setFormProdotto({...formProdotto, codice: e.target.value})} className="w-full p-3 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="Es. ARC3800H-FW2-868" />
              </div>
              <div>
                <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Descrizione</label>
                <textarea rows="3" value={formProdotto.descrizione || ''} onChange={(e) => setFormProdotto({...formProdotto, descrizione: e.target.value})} className="w-full p-3 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="Caratteristiche tecniche..."></textarea>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Prezzo (€) *</label>
                  <input required type="number" step="0.01" value={formProdotto.prezzo} onChange={(e) => setFormProdotto({...formProdotto, prezzo: e.target.value})} className="w-full p-3 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="0.00" />
                </div>
                <div>
                  <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Categoria</label>
                  <select value={formProdotto.categoria} onChange={(e) => setFormProdotto({...formProdotto, categoria: e.target.value})} className="w-full p-3 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                    <option value="Materiale">Materiale</option>
                    <option value="Assistenza">Assistenza</option>
                    <option value="Manutenzione">Manutenzione</option>
                  </select>
                </div>
              </div>
              <div className="flex gap-3 pt-4">
                <button type="button" onClick={() => setIsProdottoModalOpen(false)} className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3 rounded-xl transition">Annulla</button>
                <button type="submit" className="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition shadow-md">Salva</button>
              </div>
            </form>
          </div>
        </div>
      )}

      {/* ================= MODALE: MOVIMENTO PRIMA NOTA ================= */}
      {isMovimentoModalOpen && (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-lg w-full p-6 md:p-8 shadow-2xl animate-in">
            <div className="flex justify-between items-center mb-6">
              <h2 className="text-xl font-bold text-slate-900">Nuovo Movimento</h2>
              <button onClick={() => setIsMovimentoModalOpen(false)} className="text-slate-400 hover:text-slate-600"><X className="w-5 h-5"/></button>
            </div>
            <form onSubmit={handleSalvaMovimento} className="space-y-4">
              <div>
                <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Tipo Movimento</label>
                <select value={nuovoMovimento.tipo} onChange={(e) => setNuovoMovimento({...nuovoMovimento, tipo: e.target.value})} className="w-full p-3 border border-slate-200 rounded-xl text-sm outline-none bg-white">
                  <option value="entrata">Entrata (+)</option>
                  <option value="uscita">Uscita (-)</option>
                </select>
              </div>
              <div>
                <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Importo (€) *</label>
                <input required type="number" step="0.01" value={nuovoMovimento.importo} onChange={(e) => setNuovoMovimento({...nuovoMovimento, importo: e.target.value})} className="w-full p-3 border border-slate-200 rounded-xl text-sm outline-none" placeholder="0.00" />
              </div>
              <div>
                <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Descrizione *</label>
                <input required type="text" value={nuovoMovimento.descrizione} onChange={(e) => setNuovoMovimento({...nuovoMovimento, descrizione: e.target.value})} className="w-full p-3 border border-slate-200 rounded-xl text-sm outline-none" placeholder="Es. Saldatura impianto o acquisto cavo" />
              </div>
              <div>
                <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Cliente (facoltativo)</label>
                <select value={nuovoMovimento.cliente} onChange={(e) => setNuovoMovimento({...nuovoMovimento, cliente: e.target.value})} className="w-full p-3 border border-slate-200 rounded-xl text-sm outline-none bg-white">
                  <option value="">—</option>
                  {clienti.map(c => <option key={c.id} value={c.nome}>{c.nome}</option>)}
                </select>
              </div>
              <div className="flex gap-3 pt-4">
                <button type="button" onClick={() => setIsMovimentoModalOpen(false)} className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3 rounded-xl transition">Annulla</button>
                <button type="submit" className="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition shadow-md">Registra</button>
              </div>
            </form>
          </div>
        </div>
      )}

      {/* ================= MODALE: PREVIEW PREVENTIVO ================= */}
      {preventivoInPreview && (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-2xl w-full p-6 md:p-8 shadow-2xl animate-in max-h-[90vh] overflow-y-auto">
            <div className="flex justify-between items-center mb-6 border-b pb-4">
              <div>
                <h2 className="text-xl font-bold text-slate-900">Preventivo #{preventivoInPreview.id.substring(preventivoInPreview.id.length - 6)}</h2>
                <div className="text-xs text-slate-400">Emesso il {preventivoInPreview.data}</div>
              </div>
              <button onClick={() => setPreventivoInPreview(null)} className="text-slate-400 hover:text-slate-600"><X className="w-5 h-5"/></button>
            </div>

            <div id="printable-area" className="space-y-6">
              <IntestazioneAzienda azienda={azienda} />
              <div className="text-sm font-bold uppercase tracking-wide text-slate-700">Preventivo n. {preventivoInPreview.id.substring(preventivoInPreview.id.length - 6)} del {preventivoInPreview.data}</div>
              <div className="bg-slate-50 p-4 rounded-xl border border-slate-100">
                <div className="text-xs uppercase font-bold text-slate-400">Intestato a</div>
                <div className="text-lg font-bold text-slate-900">{preventivoInPreview.cliente}</div>
              </div>

              <div>
                <h3 className="text-xs font-bold uppercase text-slate-500 mb-2">Articoli Inclusi</h3>
                <table className="w-full text-left border-collapse text-sm">
                  <thead>
                    <tr className="border-b text-xs text-slate-400">
                      <th className="py-2">Articolo</th>
                      <th className="py-2 text-center">Quantità</th>
                      <th className="py-2 text-right">Prezzo</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {preventivoInPreview.articoli.map((art, idx) => (
                      <tr key={idx}>
                        <td className="py-2 font-medium text-slate-800"><div className="flex items-center gap-3"><Thumb src={art.foto} size="w-14 h-14" /><div>{art.nome}{art.codice && <div className="text-xs font-normal text-slate-500">{art.codice}</div>}{art.descrizione && <div className="text-xs font-normal text-slate-400 line-clamp-3">{art.descrizione}</div>}</div></div></td>
                        <td className="py-2 text-center text-slate-600">{art.quantita}</td>
                        <td className="py-2 text-right font-semibold text-slate-900">{(art.prezzo * art.quantita).toFixed(2)} €</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

              {preventivoInPreview.imponibile != null && (
                <div className="text-sm text-slate-500 space-y-1 pt-2">
                  <div className="flex justify-between"><span>Subtotale</span><span>{preventivoInPreview.subtotale.toFixed(2)} €</span></div>
                  {preventivoInPreview.sconto > 0 && <div className="flex justify-between"><span>Sconto {preventivoInPreview.sconto}%</span><span>-{(preventivoInPreview.subtotale - preventivoInPreview.imponibile).toFixed(2)} €</span></div>}
                  <div className="flex justify-between"><span>Imponibile</span><span>{preventivoInPreview.imponibile.toFixed(2)} €</span></div>
                  <div className="flex justify-between"><span>IVA {preventivoInPreview.iva}%</span><span>{preventivoInPreview.ivaImporto.toFixed(2)} €</span></div>
                </div>
              )}
              <div className="flex justify-between items-center pt-4 border-t font-bold text-lg">
                <span>Totale{preventivoInPreview.imponibile != null ? ' (IVA incl.)' : ''}:</span>
                <span className="text-blue-600">{preventivoInPreview.totale.toFixed(2)} €</span>
              </div>

              <div className="flex items-center justify-between pt-2 print:hidden">
                <span className="text-xs text-slate-500 uppercase font-bold">Stato Attuale:</span>
                <div className="flex gap-2">
                  {['In attesa', 'Approvato', 'Rifiutato'].map(st => (
                    <button
                      key={st}
                      onClick={() => handleAggiornaStatoPreventivo(preventivoInPreview.id, st)}
                      className={`px-3 py-1 rounded-lg text-xs font-bold transition ${preventivoInPreview.stato === st ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                    >
                      {st}
                    </button>
                  ))}
                </div>
              </div>
            </div>

            <div className="flex flex-wrap gap-3 pt-6 border-t mt-6">
              <button onClick={() => richiediEliminaPreventivo(preventivoInPreview)} title="Elimina preventivo" className="bg-red-50 hover:bg-red-100 text-red-500 px-4 rounded-xl transition"><Trash2 className="w-4 h-4" /></button>
              <button onClick={() => window.print()} className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3 rounded-xl transition flex items-center justify-center gap-2">
                <Printer className="w-4 h-4" /> Stampa PDF
              </button>
              <button onClick={handleInviaEmail} className="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition flex items-center justify-center gap-2 shadow-md">
                <Mail className="w-4 h-4" /> Invia via Email
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ================= MODALE: DATI AZIENDA ================= */}
      {isAziendaOpen && (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-lg w-full p-6 md:p-8 shadow-2xl animate-in max-h-[90vh] overflow-y-auto">
            <div className="flex justify-between items-center mb-2">
              <h2 className="text-xl font-bold text-slate-900">Dati Azienda</h2>
              <button onClick={() => setIsAziendaOpen(false)} className="text-slate-400 hover:text-slate-600"><X className="w-5 h-5"/></button>
            </div>
            <p className="text-xs text-slate-500 mb-4">Compaiono nell'intestazione di preventivi e DiCo. Si salvano automaticamente.</p>
            <div className="space-y-3">
              {[['ragioneSociale','Ragione sociale'],['responsabile','Titolare / Legale rappresentante'],['piva','P.IVA / C.F.'],['cciaa','Iscrizione CCIAA n.'],['indirizzo','Indirizzo sede'],['telefono','Telefono'],['email','Email']].map(([k, l]) => (
                <div key={k}>
                  <label className="block text-xs font-bold uppercase text-slate-500 mb-1">{l}</label>
                  <input type="text" value={azienda[k] || ''} onChange={(e) => setAzienda({...azienda, [k]: e.target.value})} className="w-full p-3 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
              ))}
            </div>
            <button onClick={() => setIsAziendaOpen(false)} className="w-full mt-5 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition shadow-md">Fatto</button>
          </div>
        </div>
      )}

      {/* ================= MODALE: ANTEPRIMA DiCo ================= */}
      {dicoInPreview && (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-2xl w-full p-6 md:p-8 shadow-2xl animate-in max-h-[90vh] overflow-y-auto">
            <div className="flex justify-between items-center mb-4 border-b pb-4">
              <h2 className="text-xl font-bold text-slate-900">DiCo n. {dicoInPreview.numero}</h2>
              <button onClick={() => setDicoInPreview(null)} className="text-slate-400 hover:text-slate-600"><X className="w-5 h-5"/></button>
            </div>
            <div id="printable-area" className="space-y-4 text-sm text-slate-800">
              <IntestazioneAzienda azienda={azienda} />
              <div className="text-center">
                <h3 className="font-bold text-base uppercase">Dichiarazione di conformità dell'impianto alla regola dell'arte</h3>
                <div className="text-xs text-slate-500">(D.M. 22 gennaio 2008, n. 37, art. 7)</div>
                <div className="text-xs mt-1">N. {dicoInPreview.numero} del {dicoInPreview.dataFineLavori}</div>
              </div>
              <p>Il sottoscritto <b>{azienda.responsabile || '________________'}</b>, titolare o legale rappresentante dell'impresa <b>{azienda.ragioneSociale || '________________'}</b>, P.IVA/C.F. {azienda.piva || '________________'}, iscritta alla CCIAA n. {azienda.cciaa || '________'}, esecutrice dell'impianto:</p>
              <table className="w-full border-collapse text-sm">
                <tbody className="divide-y divide-slate-200 border-y border-slate-200">
                  <tr><td className="py-2 pr-3 font-semibold w-40">Tipologia</td><td>{dicoInPreview.tipologia}</td></tr>
                  <tr><td className="py-2 pr-3 font-semibold">Committente</td><td>{dicoInPreview.cliente}</td></tr>
                  <tr><td className="py-2 pr-3 font-semibold">Ubicazione</td><td>{dicoInPreview.indirizzo || '—'}</td></tr>
                  <tr><td className="py-2 pr-3 font-semibold">Fine lavori</td><td>{dicoInPreview.dataFineLavori}</td></tr>
                  <tr><td className="py-2 pr-3 font-semibold">Norme di riferimento</td><td>{NORME[dicoInPreview.tipologia]}</td></tr>
                  {dicoInPreview.note && <tr><td className="py-2 pr-3 font-semibold align-top">Materiali e note</td><td className="whitespace-pre-line">{dicoInPreview.note}</td></tr>}
                </tbody>
              </table>
              <p><b>DICHIARA</b> sotto la propria personale responsabilità che l'impianto è stato realizzato in modo conforme alla regola dell'arte, avendo:</p>
              <ul className="list-disc pl-5 space-y-1">
                <li>rispettato il progetto redatto ai sensi della normativa vigente;</li>
                <li>seguito la normativa tecnica applicabile all'impiego;</li>
                <li>installato componenti e materiali adatti al luogo di installazione;</li>
                <li>controllato l'impianto ai fini della sicurezza e della funzionalità, con esito positivo.</li>
              </ul>
              <p className="text-xs text-slate-600"><b>Allegati obbligatori:</b> progetto; relazione con tipologie dei materiali utilizzati; schema dell'impianto realizzato; riferimento a dichiarazioni di conformità precedenti o parziali; copia del certificato di riconoscimento dei requisiti tecnico-professionali.</p>
              <div className="flex justify-between pt-8 text-xs text-slate-500">
                <div>Data ______________</div>
                <div className="text-center">Timbro e firma del dichiarante<div className="mt-8 border-t border-slate-400 w-56"></div></div>
              </div>
            </div>
            <div className="flex gap-3 pt-6 border-t mt-6">
              <button onClick={() => richiediEliminaDico(dicoInPreview)} title="Elimina" className="bg-red-50 hover:bg-red-100 text-red-500 px-4 rounded-xl transition"><Trash2 className="w-4 h-4" /></button>
              <button onClick={() => window.print()} className="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition flex items-center justify-center gap-2 shadow-md"><Printer className="w-4 h-4" /> Stampa / Salva PDF</button>
            </div>
          </div>
        </div>
      )}

      {/* ================= MODALE DI CONFERMA ELIMINAZIONE ================= */}
      {conferma && (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-md w-full p-6 md:p-8 shadow-2xl animate-in text-center">
            <AlertTriangle className="w-12 h-12 text-amber-500 mx-auto mb-4" />
            <h2 className="text-xl font-bold text-slate-900 mb-2">Conferma Operazione</h2>
            <p className="text-slate-600 text-sm mb-6">{conferma.messaggio}</p>
            <div className="flex gap-3">
              <button onClick={() => setConferma(null)} className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3 rounded-xl transition">Annulla</button>
              <button onClick={conferma.onConferma} className="flex-1 bg-red-600 hover:bg-red-700 text-white font-semibold py-3 rounded-xl transition shadow-md">Conferma</button>
            </div>
          </div>
        </div>
      )}

      {/* ================= TOAST NOTIFICATIONS ================= */}
      <div className="fixed bottom-5 right-5 z-50 space-y-2 pointer-events-none">
        {toasts.map(t => (
          <div key={t.id} className="pointer-events-auto bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 text-sm animate-in">
            {t.tipo === 'info' ? <Clock className="w-4 h-4 text-blue-400 shrink-0"/> : <CheckCircle className="w-4 h-4 text-emerald-400 shrink-0"/>}
            <span>{t.messaggio}</span>
          </div>
        ))}
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
